[PREAMPADC]
# Measured https://confluence.slac.stanford.edu/display/CMBS4SLAC/SSA+curves
# This is 1413361.3
ADU_TO_VOLTS_AT_PREAMP_INPUT = 7.075e-7
ADC_NBITS = 14

[CRYOCABLE]
# From SSA load curves - https://confluence.slac.stanford.edu/display/CMBS4SLAC/20240318+-+SSA+module+load+curves+for+4K+CMOS+follow-on+amplifier+specs
CRYOCABLE_ROUNDTRIP_RESISTANCE_OHMS = 123.6

[SSA]
# SSA FB
SSA_FB_DAC_MAX_VOLTAGE_VOLTS = 2.5
SSA_FB_DAC_NBITS = 16
SSA_FB_BACKPLANE_RESISTANCE_OHMS = 5000
SSA_FB_BC_RESISTANCE_OHM = 200

SSA_M_IN_PICOHENRY = 86.5

# SSA BIAS
SSA_BIAS_DAC_MAX_VOLTAGE_VOLTS = 2.5
SSA_BIAS_DAC_NBITS = 16
SSA_BIAS_RC_RESISTANCE_OHMS = 15000

# SSA BIAS OFFSET
SSA_BIAS_OFFSET_DAC_MAX_VOLTAGE_VOLTS = 2.5
SSA_BIAS_OFFSET_DAC_NBITS = 16
# R12 in RC RevB9 schematic
SSA_BIAS_OFFSET_RC_FB_RESISTANCE_OHMS = 100
# R11 in RC RevB9 schematic
SSA_BIAS_OFFSET_RC_IN_RESISTANCE_OHMS = 33.2
# R37 in RC RevB9 schematic
SSA_BIAS_OFFSET_RC_BIAS_RESISTANCE_OHMS = 820

[SQ1]
# SQ1 FB
SQ1_FB_DAC_MAX_CURRENT_A = 0.02
SQ1_FB_DAC_NBITS = 14
SQ1_FB_BACKPLANE_RESISTANCE_OHMS = 6200
SQ1_FB_RC_R28_OHM = 49.9
SQ1_FB_RC_R33_OHM = 49.9
# Cold SQ1B shunt resistor
R_SHUNT = 1

# SQ1 BIAS
SQ1_BIAS_DAC_MAX_VOLTAGE_VOLTS = 2.5
SQ1_BIAS_DAC_NBITS = 16
SQ1_BIAS_BACKPLANE_RESISTANCE_OHMS = 10000
SQ1_BIAS_BC_RESISTANCE_OHM = 200

# SQ1 INPUT
SQ1_M_IN_PICOHENRY = 688
